<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banc colonne de marché</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1e3150;
        color: #f4eedb;
        font:
          13px/1.4 system-ui,
          sans-serif;
      }
      #vue {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #reglages {
        position: fixed;
        left: 12px;
        top: 12px;
        width: 260px;
        max-width: calc(100vw - 48px);
        max-height: calc(100vh - 48px);
        overflow: auto;
        background: #13221ee8;
        border: 1px solid #b6a787;
        border-radius: 8px;
        padding: 10px 12px;
      }
      #reglages h1 {
        font-size: 15px;
        margin: 0 0 6px;
      }
      #reglages label {
        display: block;
        margin: 8px 0 2px;
      }
      #reglages input[type='range'] {
        width: 100%;
      }
      #reglages button {
        margin: 6px 6px 0 0;
      }
      #reglages small,
      #mesure {
        display: block;
        opacity: 0.8;
        margin-top: 6px;
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <canvas id="vue"></canvas>
    <aside id="reglages">
      <h1>Colonne de marché</h1>
      <small>Cliquer sur l’hôtel de ville pour déclencher. Glisser pour tourner, molette pour zoomer.</small>
      <label>Heure : <span id="heure-texte"></span></label>
      <input id="heure" type="range" autocomplete="off" min="-0.35" max="0.6" step="0.01" />
      <button id="declencher" type="button">Déclencher</button>
      <button id="groupe" type="button">Trois livraisons groupées</button>
      <label>Lumière, intensité : <span id="intensite-texte"></span></label>
      <input id="intensite" type="range" autocomplete="off" min="0" max="8" step="0.1" />
      <label>Lumière, hauteur : <span id="hauteur-texte"></span></label>
      <input id="hauteur" type="range" autocomplete="off" min="0.5" max="10" step="0.1" />
      <label>Lumière, portée : <span id="portee-texte"></span></label>
      <input id="portee" type="range" autocomplete="off" min="3" max="16" step="0.5" />
      <label>Tenue (ms) : <span id="tenue-texte"></span></label>
      <input id="tenue" type="range" autocomplete="off" min="200" max="2500" step="20" />
      <button id="copier" type="button">Copier les réglages</button>
      <span id="mesure"></span>
    </aside>
    <script type="module" src="./marche.ts"></script>
  </body>
</html>
