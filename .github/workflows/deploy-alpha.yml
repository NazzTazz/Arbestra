name: Deploy alpha
on:
  push:
    tags: ['alpha-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-alpha
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: alpha
      url: https://play.arbestra.world
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/deploy
        with:
          environment: alpha
          host: ${{ vars.VPS_HOST }}
          host-key: ${{ secrets.VPS_HOST_KEY }}
          ssh-key: ${{ secrets.VPS_DEPLOY_KEY }}
