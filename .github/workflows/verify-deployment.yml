name: Verify public deployment
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to check without changing it
        required: true
        type: choice
        options: [staging, alpha]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check public TLS, frontends and API access boundaries
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          environment = os.environ['DEPLOY_ENVIRONMENT']
          assert environment in ('staging', 'alpha')
          lobby, game, noc = ('play-beta', 'beta', 'noc-beta') if environment == 'staging' else ('play', 'alpha', 'noc')
          checks = [(lobby, '/', 200), (game, '/', 200), (noc, '/', 401),
                    (game, '/api/health', 200), (game, '/api/admin/session', 404),
                    (game, '/api/observation/00000000-0000-4000-8000-000000000001/snapshot', 401)]
          failed = False
          for host, path, expected in checks:
              url = 'https://' + host + '.arbestra.world' + path
              for attempt in range(3):
                  started = time.monotonic()
                  try:
                      try:
                          response = urllib.request.urlopen(url, timeout=10)
                      except urllib.error.HTTPError as error:
                          response = error
                      with response:
                          status, body = response.code, response.read()
                      valid = status == expected
                      if path == '/api/health' and valid:
                          valid = json.loads(body).get('status') == 'ok'
                      result = {'url': url, 'status': status, 'expected': expected, 'ok': valid}
                  except Exception as error:
                      valid = False
                      result = {'url': url, 'error': type(error).__name__, 'ok': False}
                  result.update(attempt=attempt + 1, elapsedMs=round((time.monotonic() - started) * 1000))
                  print(json.dumps(result), flush=True)
                  if valid:
                      break
                  time.sleep(2)
              failed |= not valid
          raise SystemExit(1 if failed else 0)
          PY
