services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: arbestra
      POSTGRES_USER: arbestra
      POSTGRES_PASSWORD: arbestra
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbestra -d arbestra"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - arbestra-postgres:/var/lib/postgresql/data

volumes:
  arbestra-postgres:
